name: Cloud probe (test only)
# Read-only test: checks which booking sites can be read from GitHub's servers.
# Runs only when started by hand or when the probe script changes. Writes nothing.
on:
  workflow_dispatch:
  push:
    paths: [tools/probe.py, .github/workflows/probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: python tools/probe.py
        env:
          ROUTE: DEL-BOM
